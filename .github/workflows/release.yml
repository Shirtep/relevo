name: Release

# Pushing a tag like v0.1.0 builds the .vsix and attaches it to a GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run package
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(awk "/^## ${GITHUB_REF_NAME#v}\$/{flag=1;next}/^## /{flag=0}flag" CHANGELOG.md)
          gh release create "$GITHUB_REF_NAME" *.vsix --title "Relevo $GITHUB_REF_NAME" --notes "$notes"
